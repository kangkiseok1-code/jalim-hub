<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>자림</title>
<meta name="description" content="사주로 나를 알아가는 시간. 인생 다시 걷기·기운 체크인 체험과 분석·만남·심화상담·재물운 달력 앱을 한곳에서.">
<meta property="og:title" content="자림 · 나를 알아가는 시간">
<meta property="og:description" content="사주로 나를 알아가는 시간. 체험 3가지와 앱 5개를 한곳에서.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="jalim-base.css">
<style>
#app{max-width:640px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px max(60px,env(safe-area-inset-bottom))}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title{font-family:var(--serif);font-size:2.4rem;font-weight:700;letter-spacing:.14em;margin:8px 0 0;color:var(--ink)}
.title-sub{font-size:1rem;color:var(--sub);margin:2px 0 20px;font-weight:600;letter-spacing:.02em}
.head-acts{display:flex;align-items:center;gap:8px;flex:none;margin-top:10px}
#hshare{white-space:nowrap}
.grid{display:flex;flex-direction:column;gap:12px}
.card{position:relative;display:flex;align-items:center;gap:14px;min-height:72px;margin:0;padding:14px 56px 14px 18px;color:var(--ink);text-decoration:none;touch-action:manipulation}
.card:active{transform:scale(.97);transition:transform .1s ease-out}
@media(hover:hover){.card:hover{background:#f1ece1}}
.card .ic{width:24px;height:24px;color:var(--gold)}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.name{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.hint{margin:0;font-size:.85rem;color:var(--sub)}
.hint[hidden]{display:none}
.info{position:absolute;top:50%;right:6px;margin-top:-22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;border-radius:22px;touch-action:manipulation}
.info[aria-expanded="true"]{color:var(--gold)}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--gold-soft);border-color:var(--ink)}
/* 로그인 시트 */
.jn-sheet{max-height:92vh;overflow-y:auto}
.status{font-size:.85rem;margin:10px 0 0;min-height:1.2em}
.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.btn.kakao{width:100%;background:#FEE500;color:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
@media(hover:hover){.btn.kakao:hover{background:#f5dc00}}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 2px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.switch{color:var(--gold);cursor:pointer;font-weight:600}
/* 로그인 성공 표시 */
.jn-sheet:has(.done){display:flex;flex-direction:column}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0;margin:auto}
.done svg{width:64px;height:64px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done circle{stroke:var(--ok-soft);fill:var(--ok-soft);transform-origin:center}
.done b{font-size:1.05rem}
/* 오늘의 기운 카드 */
.today{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-list)}
.today-in{display:flex;align-items:center;gap:14px;padding:16px 18px;color:inherit;text-decoration:none;border-radius:var(--r-list);touch-action:manipulation}
@media(hover:hover){.today-in:hover{background:var(--surface-2)}}
.today[hidden]{display:none}
.today.jn-skel{min-height:96px;border-color:transparent}
/* 나의 분석 바로가기 */
.mytiles{margin:0 0 14px}.mytiles[hidden]{display:none}
.sec-label{font-size:.8rem;font-weight:600;color:var(--sub);margin:0 2px 8px}
.exp{margin:0 0 18px}
.name .jn-chip.try{background:var(--gold-soft);color:var(--gold-ink)}
.mytile-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mytile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-list);color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:600;touch-action:manipulation}
.mytile .ic{width:24px;height:24px;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(hover:hover){.mytile:hover{background:var(--surface-2)}}
.today-mark{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:1.7rem;font-weight:700}
.today-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.today-date{font-size:.78rem;color:var(--sub)}
.today-txt b{font-size:1.05rem;line-height:1.35;word-break:keep-all}
.today-line{font-size:.85rem;color:var(--ink);line-height:1.5;word-break:keep-all}
.today-lucky{font-size:.78rem;color:var(--sub)}
/* 승인 신청 */
.name .jn-chip{margin-left:6px;min-height:22px;padding:0 8px;font-size:.72rem;vertical-align:middle}
.name .jn-chip[hidden]{display:none}   /* hidden 속성이 inline-flex에 덮이지 않게 — 상태가 없을 때 빈 알약이 보이던 문제 */
.consent{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.85rem;line-height:1.55}
.consent p{margin:6px 0 0;color:var(--sub)}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.arow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ainfo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ainfo .sub{flex-basis:100%;font-size:.8rem;overflow-wrap:anywhere}
.aact{display:flex;gap:8px}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <div>
      <h1 class="title">자림</h1>
      <p class="title-sub">나를 알아가는 시간</p>
    </div>
    <div class="head-acts"><button id="hshare" class="btn sm" type="button" hidden>공유하기</button><button id="acct" class="btn sm" type="button">로그인</button></div>
  </div>
  <div class="today" id="today" hidden></div>
  <div class="mytiles" id="mytiles" hidden></div>
  <div class="exp" id="exp"><p class="sec-label">체험</p><div class="grid jm-stagger" id="expgrid"></div></div>
  <p class="sec-label">앱</p>
  <div class="grid jm-stagger" id="grid"></div>
  <div class="foot">ⓘ를 누르면 설명이 펼쳐져요</div>
</div>

<script>
/* 선 아이콘 — 만남 앱 MI 세트와 같은 규격 */
var BASE='https://kangkiseok1-code.github.io/';
var APPS=[
  {name:'분석',   href:BASE+'analysis-app/?go=saju',              hint:'사주·성향·대인관계·기호로 나를 알아가요',
   icon:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'},
  {name:'만남',   href:BASE+'mating-app/',                 hint:'나에게 맞는 인연을 찾아가요',
   icon:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/>'},
  {name:'심화상담', href:BASE+'counsel-tool/',              hint:'나에 대한 설명이 필요할 때, 고민이 있을 때', gate:'counsel',
   icon:'<path d="M4 5h16v11H9l-5 4z"/>'},
  {name:'재물운 달력', href:BASE+'lotto-app/',               hint:'날짜별 재물운과 번호 추천',
   icon:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'},
  {name:'팀메이커', href:BASE+'Team-maker/team-maker.html', hint:'사주와 성향으로 팀을 이해하고 구성해요',
   icon:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c1.8.7 3 2.6 3.5 5.5"/>'}
];
var EXPS=[
  {name:'인생 다시 걷기', href:BASE+'life-walk/', tag:'5분', hint:'태어난 해부터 걸으며 내 과거가 사주 흐름과 얼마나 겹치는지 봐요. 가입 없이 시작해요',
   icon:'<circle cx="13" cy="4.5" r="2"/><path d="M10 21l2-6-2.5-2.5 1.5-4 3 1.5 2 3.5M12 15l3 6M9.5 10.5L7 12"/>'},
  {name:'같이 걷기', href:BASE+'life-walk/together.html', tag:'둘이서', hint:'링크로 초대한 사람과 두 사람의 세월을 나란히 걸어요. 로그인하고 서로 허용해야 시작되고, 상대 생년월일은 보이지 않아요',
   icon:'<circle cx="8.5" cy="5" r="2"/><circle cx="16" cy="5" r="2"/><path d="M6.5 21l1.5-6-2-2 1.5-4 3 1.5 1 2.5M14 21l1.5-6-1.5-2.5 1.5-4 3 1.5 1.5 3M8 15l2.5 6M15.5 15l2.5 6"/>'},
  {name:'기운 체크인', href:BASE+'checkin/', tag:'하루 10초', hint:'오늘 기분을 한 번 탭해 두면, 기록이 쌓이면서 내 기분이 날마다의 기운과 어떻게 겹치는지 경향을 보여줘요. 가입 없이 시작해요',
   icon:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 13.5c1 1.6 2.2 2.3 3.5 2.3s2.5-.7 3.5-2.3M9 9.5h.01M15 9.5h.01"/>'}
];
var INFO='<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>';
function addCard(a,id,parent){
  var el=document.createElement('a');
  el.className='card'; el.href=a.href; if(a.gate) el.setAttribute('data-gate',a.gate);
  el.innerHTML='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+a.icon+'</svg>'
    +'<div class="txt"><span class="name">'+a.name+(a.gate?' <span class="jn-chip warn" id="gate-'+a.gate+'" hidden></span>':'')+(a.tag?' <span class="jn-chip try">'+a.tag+'</span>':'')+'</span><p class="hint" id="h'+id+'" hidden>'+a.hint+'</p></div>'
    +'<button type="button" class="info" aria-label="'+a.name+' 설명 보기" aria-expanded="false" aria-controls="h'+id+'"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+INFO+'</svg></button>';
  var btn=el.querySelector('.info'), hint=el.querySelector('.hint');
  btn.addEventListener('click',function(e){
    e.preventDefault(); e.stopPropagation();
    var open=hint.hidden; hint.hidden=!open; btn.setAttribute('aria-expanded',open);
  });
  parent.appendChild(el);
}
EXPS.forEach(function(a,i){ addCard(a,'x'+i,document.getElementById('expgrid')); });
APPS.forEach(function(a,i){ addCard(a,i,document.getElementById('grid')); });
</script>
<!-- 로그인 라이브러리(CDN)는 카드 목록을 그린 뒤에 불러온다: CDN이 느리거나 막혀도 카드가 먼저 보이게 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="hub-auth.js"></script>
<script src="hub-today.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
